<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONG Esperança Viva - Cadastro</title>
    <link rel="stylesheet" href="css/estilos.css">
    
</head>
<body>

   <header>
     <div class="header-container">
            <h1>ONG Esperança Viva</h1>

            <!-- Ícone do Menu Hambúrguer sem erro de validação -->
            <input type="checkbox" id="menu-toggle" class="menu-checkbox" aria-label="Abrir Menu">
            <label for="menu-toggle" class="menu-hamburguer">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <!-- Menu de Navegação Integrado -->
            <nav class="nav-menu">
                <ul>
                    <li><a href="#inicio">Início</a></li>
                    <li class="dropdown">
                        <a href="#projetos" class="dropdown-link">Projetos ▾</a>
                        <ul class="dropdown-menu">
                            <li><a href="#prato-cheio">Projeto Prato Cheio</a></li>
                            <li><a href="#futuro-digital">Projeto Futuro Digital</a></li>
                        </ul>
                    </li>
                    <li><a href="#cadastro">Seja Voluntário / Doador</a></li>
                </ul>
            </nav>
        </div>
</header>
   <main id="cadastro" class="container-grid">
        <h2>Faça Parte da Nossa Causa</h2>

        <form action="#" method="post">
            
            <fieldset>
                <legend>Dados Pessoais</legend>

                <div>
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required minlength="3">
                </div>

                <div>
                    <label for="cpf">CPF (apenas números):</label>
                    <input type="text" id="cpf" name="cpf" required pattern="\d{11}" maxlength="11" placeholder="12345678901" title="Digite exatamente 11 dígitos numéricos">
                </div>

                <div>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required placeholder="exemplo@email.com">
                </div>

                <div>
                    <label for="nascimento">Data de Nascimento:</label>
                    <input type="date" id="nascimento" name="nascimento" required>
                </div>

                <div>
                    <label for="telefone">Telefone / WhatsApp:</label>
                    <input type="tel" id="telefone" name="telefone" required pattern="\d{10,11}" placeholder="61999999999" title="Digite DDD e número sem espaços ou traços">
                </div>
            </fieldset>

            <fieldset>
                <legend>Endereço e Localização</legend>

                <div>
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" required pattern="\d{8}" maxlength="8" placeholder="70000000" title="Digite os 8 dígitos do CEP sem hífen">
                </div>

                <div>
                    <label for="endereco">Endereço (Rua, Número, Bairro):</label>
                    <input type="text" id="endereco" name="endereco" required>
                </div>

                <div>
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required>
                </div>

                <div>
                    <label for="estado">Estado (UF):</label>
                    <input type="text" id="estado" name="estado" required maxlength="2" placeholder="DF" title="Digite a sigla do estado com 2 letras">
                </div>
            </fieldset>

            <fieldset>
                <legend>Perfil de Engajamento</legend>

                <div>
                    <label for="perfil">Deseja atuar como:</label>
                    <select id="perfil" name="perfil" required>
                        <option value="">Selecione uma opção...</option>
                        <option value="voluntario">Voluntário</option>
                        <option value="doador">Doador</option>
                        <option value="ambos">Ambos</option>
                    </select>
                </div>

                <div>
                    <label for="mensagem">Mensagem / Observações:</label>
                    <textarea id="mensagem" name="mensagem" rows="4"></textarea>
                </div>
            </fieldset>

            <button type="submit">Enviar Cadastro</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 ONG Esperança Viva. Todos os direitos reservados.</p>
    </footer>
    <script src="js/main.js"></script>

</body>
</html>
